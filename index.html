<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>Watermelon — Curated Design Inspiration Gallery</title>
    <meta
      name="description"
      content="A curated directory of the best design resources, UI libraries, and tools for modern web development. Explore hand-picked inspiration from top designers."
    />
    <meta
      name="keywords"
      content="design inspiration, UI library, web design, design resources, UI components, design tools, frontend, curated gallery"
    />
    <meta name="author" content="Watermelon" />
    <meta
      name="robots"
      content="index,follow,max-snippet:-1,max-image-preview:large,max-video-preview:-1"
    />
    <link rel="canonical" href="https://watermelon-ui.com/" />
    <meta
      name="theme-color"
      content="#0a0a0a"
      media="(prefers-color-scheme: dark)"
    />
    <meta
      name="theme-color"
      content="#ffffff"
      media="(prefers-color-scheme: light)"
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="Watermelon — Curated Design Inspiration Gallery"
    />
    <meta
      property="og:description"
      content="A curated directory of the best design resources, UI libraries, and tools for modern web development."
    />
    <meta property="og:url" content="https://watermelon-ui.com/" />
    <meta property="og:site_name" content="Watermelon" />
    <meta property="og:locale" content="en_US" />
    <meta
      property="og:image"
      content="https://watermelon-ui.com/og-image.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Watermelon — Design Inspiration Gallery"
    />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Watermelon — Curated Design Inspiration Gallery"
    />
    <meta
      name="twitter:description"
      content="A curated directory of the best design resources, UI libraries, and tools for modern web development."
    />
    <meta
      name="twitter:image"
      content="https://watermelon-ui.com/og-image.png"
    />

    <!-- Hreflang -->
    <link rel="alternate" hreflang="en-us" href="https://watermelon-ui.com/" />
    <link
      rel="alternate"
      hreflang="x-default"
      href="https://watermelon-ui.com/"
    />

    <!-- Sitemap -->
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
